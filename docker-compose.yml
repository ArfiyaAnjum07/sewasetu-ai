services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sewasetu
      POSTGRES_USER: sewasetu
      POSTGRES_PASSWORD: sewasetu123
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./seed/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql

  app:
    build: ./app
    ports:
      - "8000:8000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-deploying}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
    depends_on:
      - db
      - smsgw
    volumes:
      - ./app:/app
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  scheduler:
    build: ./app
    command: ["sh", "-c", "until python /app/scripts/deemed_approval.py; do sleep 5; done; exec cron -f"]
    depends_on:
      - db
    volumes:
      - ./app:/app
      - applogs:/var/log/sewasetu

  smsgw:
    build: ./smsgw
    expose:
      - "8025"

  citizen-mcp:
    build: ./app
    command: ["python", "/app/mcp_servers/citizen.py"]
    ports:
      - "8101:8101"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_INTERNAL_URL: http://app:8000
      MCP_AUDIENCE: ${MCP_CITIZEN_AUDIENCE:-http://localhost:8101}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
    depends_on:
      - db
      - app
    volumes:
      - ./app:/app
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

  officer-mcp:
    build: ./app
    command: ["python", "/app/mcp_servers/officer.py"]
    ports:
      - "8102:8102"
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      PORTAL_INTERNAL_URL: http://app:8000
      MCP_AUDIENCE: ${MCP_OFFICER_AUDIENCE:-http://localhost:8102}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: sewasetu
      DB_USER: sewasetu
      DB_PASSWORD: sewasetu123
    depends_on:
      - db
      - app
    volumes:
      - ./app:/app
      - uploads:/var/sewasetu/uploads
      - applogs:/var/log/sewasetu

volumes:
  pgdata:
  uploads:
  applogs:
